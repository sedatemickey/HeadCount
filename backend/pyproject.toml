[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "headcount-backend"
version = "0.1.0"
description = "Local-first classroom photograph head counting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.10,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<3", "alembic>=1.14,<2",
  "pydantic>=2.8,<3", "python-multipart>=0.0.20,<1",
  "Pillow>=11.3,<13", "numpy>=1.26,<3", "onnxruntime>=1.20,<2",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "onnx>=1.17,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
